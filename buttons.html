<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0');
    </style>
    <title>Button Packs</title>
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #dadada; gap: 5px; flex-direction: column;">
    <!-- Botão 1 -->
    <button style="
    background-color: #FAFAFA;
    border: 1px solid #E0E0E0;
    border-radius: 8px;
    color: #333333;
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    font-weight: 500;
    padding: 10px 20px;
    cursor: pointer;
    transform:translateY(4px);
    transition: 0.3s;
    " onmouseover="
    this.style.transform='translateY(0px)';
    this.style.backgroundColor='rgb(50, 200, 50)';
    this.style.color='white';
    " onmouseout="
    this.style.transform='translateY(4px)';
    this.style.backgroundColor='#FAFAFA';
    this.style.color='#333333';
    ">Começar</button>
    <!--------------------------------->
    <br>
    <!--Botão 2-->
    <button style="
    background-color: #FAFAFA;
    border: 1px solid #E0E0E0;
    border-radius: 8px;
    color: #333333;
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    font-weight: 500;
    padding: 10px 20px;
    cursor: pointer;
    display: inline-flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
    " onmouseover="
    this.style.backgroundColor='rgb(100, 100, 240)';
    this.style.color='white';
    Object.assign(this.firstElementChild.style,{width:'24px',marginLeft:'8px',opacity:1,transform:'translateX(0)'});
    " onmouseout="
    Object.assign(this.firstElementChild.style,{width:'0',marginLeft:'0',opacity:0,transform:'translateX(-6px)'});
    this.style.backgroundColor='#FAFAFA';
    this.style.color='#333333';
    "><span aria-hidden="true" class="material-symbols-outlined" style="
    display: inline-block;
    order: 1;
    overflow: hidden;
    width: 0;
    margin-left: 0;
    opacity: 0;
    transform: translateX(-6px);
    vertical-align: middle;
    font-family: 'Material Symbols Outlined';
    font-size: 20px;
    font-weight: normal;
    font-style: normal;
    line-height: 1;
    white-space: nowrap;
    direction: ltr;
    font-feature-settings: 'liga';
    -webkit-font-feature-settings: 'liga';
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1), margin-left 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    ">arrow_forward</span>Continue</button>
    <!--------------------------------->
    <br>
    <!--Botão 3-->
    <button style="
    background-color: #fafafa4f;
    border: 3px solid;
    border-color:#fafafa;
    border-radius: 50px;
    height: 45px;
    width: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333333;
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    font-weight: 500;
    padding: 10px 20px;
    cursor: pointer;
    transition: 0.3s;
    " onmouseover="
    this.style.textDecoration='underline';
    this.style.backgroundColor='white';
    " onmouseout="
    this.style.textDecoration='none';
    this.style.backgroundColor='#fafafa4f';
    ">Saiba Mais</button>
    <!--------------------------------->
</body>
</html>
